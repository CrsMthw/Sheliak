# Every version verified live on 2026-10-05 and compiled together before landing here (docs/BUILD.md).
# The catalog holds the whole planned stack; app/build.gradle.kts declares only what the current milestone uses.

[versions]
agp                    = "9.4.1"
kotlin                 = "2.4.20"
ksp                    = "2.3.12"
room                   = "2.8.5"
coreKtx                = "1.19.1"
lifecycle              = "2.11.0"
activityCompose        = "1.13.0"
composeBom             = "2026.09.01"
material3              = "1.5.0-alpha29"
navigation3            = "1.2.0"
navigationEvent        = "1.1.2"
media3                 = "1.11.1"
datastore              = "1.2.1"
retrofit               = "3.0.0"
okhttp                 = "5.5.0"
coil                   = "3.6.3"
windowManager          = "1.5.1"
coroutines             = "1.11.0"
serialization          = "1.11.0"
splashscreen           = "1.2.0"
palette                = "1.0.0"
graphicsShapes         = "1.1.0"
glance                 = "1.3.0-alpha02"
work                   = "2.12.0"
documentfile           = "1.1.0"
materialColorUtilities = "5.0.1"
junit                  = "4.13.2"

[libraries]
androidx-core-ktx                     = { group = "androidx.core",                       name = "core-ktx",                            version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx        = { group = "androidx.lifecycle",                  name = "lifecycle-runtime-ktx",               version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose  = { group = "androidx.lifecycle",                  name = "lifecycle-viewmodel-compose",         version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose    = { group = "androidx.lifecycle",                  name = "lifecycle-runtime-compose",           version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-nav3     = { group = "androidx.lifecycle",                  name = "lifecycle-viewmodel-navigation3",     version.ref = "lifecycle" }
androidx-activity-compose             = { group = "androidx.activity",                   name = "activity-compose",                    version.ref = "activityCompose" }
# The alpha BOM: Material3 1.5.0-alpha29 hard-depends on Compose 1.13 alphas, and this BOM pins the set Google
# tested together (docs/BUILD.md, "Why the alpha BOM").
androidx-compose-bom                  = { group = "androidx.compose",                    name = "compose-bom-alpha",                   version.ref = "composeBom" }
androidx-ui                           = { group = "androidx.compose.ui",                 name = "ui" }
androidx-ui-graphics                  = { group = "androidx.compose.ui",                 name = "ui-graphics" }
androidx-ui-tooling                   = { group = "androidx.compose.ui",                 name = "ui-tooling" }
androidx-ui-tooling-preview           = { group = "androidx.compose.ui",                 name = "ui-tooling-preview" }
androidx-material3                    = { group = "androidx.compose.material3",          name = "material3",                           version.ref = "material3" }
androidx-material3-navigation-suite   = { group = "androidx.compose.material3",          name = "material3-adaptive-navigation-suite", version.ref = "material3" }
androidx-material3-adaptive           = { group = "androidx.compose.material3.adaptive", name = "adaptive" }
androidx-material3-adaptive-layout    = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout" }
androidx-material3-adaptive-nav3      = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3" }
androidx-material-icons-extended      = { group = "androidx.compose.material",           name = "material-icons-extended" }
androidx-navigation3-runtime          = { group = "androidx.navigation3",                name = "navigation3-runtime",                 version.ref = "navigation3" }
androidx-navigation3-ui               = { group = "androidx.navigation3",                name = "navigation3-ui",                      version.ref = "navigation3" }
androidx-navigationevent-compose      = { group = "androidx.navigationevent",            name = "navigationevent-compose",             version.ref = "navigationEvent" }
androidx-media3-exoplayer             = { group = "androidx.media3",                     name = "media3-exoplayer",                    version.ref = "media3" }
androidx-media3-session               = { group = "androidx.media3",                     name = "media3-session",                      version.ref = "media3" }
androidx-media3-common-ktx            = { group = "androidx.media3",                     name = "media3-common-ktx",                   version.ref = "media3" }
androidx-media3-datasource-okhttp     = { group = "androidx.media3",                     name = "media3-datasource-okhttp",            version.ref = "media3" }
androidx-media3-exoplayer-workmanager = { group = "androidx.media3",                     name = "media3-exoplayer-workmanager",        version.ref = "media3" }
androidx-media3-inspector             = { group = "androidx.media3",                     name = "media3-inspector",                    version.ref = "media3" }
androidx-media3-ui-compose            = { group = "androidx.media3",                     name = "media3-ui-compose",                   version.ref = "media3" }
androidx-room-runtime                 = { group = "androidx.room",                       name = "room-runtime",                        version.ref = "room" }
androidx-room-ktx                     = { group = "androidx.room",                       name = "room-ktx",                            version.ref = "room" }
androidx-room-compiler                = { group = "androidx.room",                       name = "room-compiler",                       version.ref = "room" }
androidx-datastore-preferences        = { group = "androidx.datastore",                  name = "datastore-preferences",               version.ref = "datastore" }
androidx-window                       = { group = "androidx.window",                     name = "window",                              version.ref = "windowManager" }
androidx-splashscreen                 = { group = "androidx.core",                       name = "core-splashscreen",                   version.ref = "splashscreen" }
androidx-palette                      = { group = "androidx.palette",                    name = "palette-ktx",                         version.ref = "palette" }
androidx-graphics-shapes              = { group = "androidx.graphics",                   name = "graphics-shapes",                     version.ref = "graphicsShapes" }
androidx-documentfile                 = { group = "androidx.documentfile",               name = "documentfile",                        version.ref = "documentfile" }
androidx-work-runtime-ktx             = { group = "androidx.work",                       name = "work-runtime-ktx",                    version.ref = "work" }
glance-appwidget                      = { group = "androidx.glance",                     name = "glance-appwidget",                    version.ref = "glance" }
glance-material3                      = { group = "androidx.glance",                     name = "glance-material3",                    version.ref = "glance" }
retrofit                              = { group = "com.squareup.retrofit2",              name = "retrofit",                            version.ref = "retrofit" }
retrofit-converter-kotlinx            = { group = "com.squareup.retrofit2",              name = "converter-kotlinx-serialization",     version.ref = "retrofit" }
okhttp                                = { group = "com.squareup.okhttp3",                name = "okhttp",                              version.ref = "okhttp" }
okhttp-logging                        = { group = "com.squareup.okhttp3",                name = "logging-interceptor",                 version.ref = "okhttp" }
coil-compose                          = { group = "io.coil-kt.coil3",                    name = "coil-compose",                        version.ref = "coil" }
coil-okhttp                           = { group = "io.coil-kt.coil3",                    name = "coil-network-okhttp",                 version.ref = "coil" }
kotlinx-coroutines-android            = { group = "org.jetbrains.kotlinx",               name = "kotlinx-coroutines-android",          version.ref = "coroutines" }
kotlinx-coroutines-test               = { group = "org.jetbrains.kotlinx",               name = "kotlinx-coroutines-test",             version.ref = "coroutines" }
kotlinx-serialization-json            = { group = "org.jetbrains.kotlinx",               name = "kotlinx-serialization-json",          version.ref = "serialization" }
# The pure Kotlin port (depends only on kotlin-stdlib); the Compose-flavoured `material-kolor` is not used.
material-color-utilities              = { group = "com.materialkolor",                   name = "material-color-utilities",            version.ref = "materialColorUtilities" }
junit                                 = { group = "junit",                               name = "junit",                               version.ref = "junit" }
kotlin-test-junit                     = { group = "org.jetbrains.kotlin",                name = "kotlin-test-junit",                   version.ref = "kotlin" }

[plugins]
android-application  = { id = "com.android.application",                 version.ref = "agp" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
room                 = { id = "androidx.room",                             version.ref = "room" }
